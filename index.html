<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wasroute Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: sticky werkbalk, daarna dispatch-bord: tijdlijn over volle breedte, kaart + rit naast elkaar, ongepland eronder */
:root{
  --bg:#edf2f3; --surface:#ffffff; --sunk:#e2e9eb; --ink:#10212a; --muted:#56696f; --line:#d2dde0;
  --accent:#0a6a88; --accent-soft:#d5edf3; --on-accent:#ffffff;
  --bad:#bf3626; --bad-soft:#fbe2dd; --warn:#9a5600; --warn-soft:#fcecd2; --ok:#22784f; --ok-soft:#d9efe3;
  --plate:#f5c400; --plate-ink:#111111; --eu:#1d3e9e;
  --land:#e4ece7; --land-line:#bccbc3; --water:#d9e6ed;
  --w0:#0a7ea4; --w1:#cf5a21; --w2:#6a4ec0; --w3:#23895a; --w4:#bd3576; --w5:#8c700c; --on-w:#ffffff;
  --abs-vakantie:#2a78c8; --abs-vrij:#6a4ec0; --abs-ziek:#bf3626; --abs-training:#b8740a; --abs-bijzonder:#23895a; --abs-arts:#0a8a9a; --abs-overig:#6b7a80;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1418; --surface:#122029; --sunk:#0e1a20; --ink:#e1ebee; --muted:#8fa3ab; --line:#233740;
  --accent:#4db4d4; --accent-soft:#113444; --on-accent:#04202a;
  --bad:#f07b69; --bad-soft:#3a1c18; --warn:#e8a549; --warn-soft:#382912; --ok:#5ac690; --ok-soft:#113124;
  --land:#16262c; --land-line:#2b3f47; --water:#0e1a20;
  --w0:#41b3d9; --w1:#f08c55; --w2:#a08aee; --w3:#4fc486; --w4:#ec6dab; --w5:#d6b444; --on-w:#08141a;
  --abs-vakantie:#4a95e0; --abs-vrij:#9a84ec; --abs-ziek:#e5685a; --abs-training:#d99a32; --abs-bijzonder:#4fb883; --abs-arts:#3fb4c4; --abs-overig:#8fa0a6;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1418; --surface:#122029; --sunk:#0e1a20; --ink:#e1ebee; --muted:#8fa3ab; --line:#233740;
  --accent:#4db4d4; --accent-soft:#113444; --on-accent:#04202a;
  --bad:#f07b69; --bad-soft:#3a1c18; --warn:#e8a549; --warn-soft:#382912; --ok:#5ac690; --ok-soft:#113124;
  --land:#16262c; --land-line:#2b3f47; --water:#0e1a20;
  --w0:#41b3d9; --w1:#f08c55; --w2:#a08aee; --w3:#4fc486; --w4:#ec6dab; --w5:#d6b444; --on-w:#08141a;
  --abs-vakantie:#4a95e0; --abs-vrij:#9a84ec; --abs-ziek:#e5685a; --abs-training:#d99a32; --abs-bijzonder:#4fb883; --abs-arts:#3fb4c4; --abs-overig:#8fa0a6;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1520px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center}
.brand{display:flex;gap:9px;align-items:center;font:700 22px/1 var(--f-disp);letter-spacing:.01em;white-space:nowrap}
.brand small{font:500 13px/1 var(--f-body);color:var(--muted);letter-spacing:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{font:600 15px/1 var(--f-disp);letter-spacing:.03em;padding:9px 12px;border-radius:var(--r);border:0;background:none;color:var(--muted);cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tab{display:inline-flex;align-items:center;gap:5px}
.tab .chev{width:13px;height:13px;opacity:.7;transition:transform .15s}
.navg{position:relative}
.navg.open .chev{transform:rotate(180deg)}
.navmenu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:40;min-width:270px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:6px;gap:2px}
.navg.open .navmenu{display:grid}
@media (hover:hover){.navg:hover .navmenu{display:grid}.navg:hover .chev{transform:rotate(180deg)}}
.navmenu::before{content:"";position:absolute;inset:-8px 0 auto;height:8px}
.navmenu button{display:grid;gap:2px;text-align:left;border:0;background:none;border-radius:7px;padding:8px 10px;cursor:pointer;color:var(--ink)}
.navmenu button b{font:600 15px/1.2 var(--f-disp);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.navmenu button small{font-size:12.5px;color:var(--muted)}
.navmenu button:hover,.navmenu button:focus-visible{background:var(--sunk)}
.navmenu button[aria-current]{background:var(--accent-soft)}.navmenu button[aria-current] b{color:var(--accent)}
.navdot{width:7px;height:7px;border-radius:50%;background:var(--bad);display:inline-block}.navdot.neu{background:var(--warn)}
.tabbadge.neu{background:var(--sunk);color:var(--ink)}
.mlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mrow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
.mrow.mgroup{background:var(--sunk)}
.mgrip{color:var(--muted);width:14px;text-align:center}
.mlab{flex:1;min-width:0;display:grid;gap:1px}.mlab small{color:var(--muted);font-size:12.5px}
.mrow select.mini{max-width:210px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;align-items:start}
.mgrid .sec,.sec:has(> .mlist){align-content:start}
.mrow{flex-wrap:wrap;min-width:0}.mlab{min-width:150px}
.mgrid .mlab small{display:none}
.mgrid .mrow select.mini{max-width:150px}.mgrid .mlab{min-width:120px}
.subnav{border-top:1px solid var(--line);background:var(--bg)}
.subnav-in{max-width:1520px;margin:0 auto;display:flex;gap:4px;align-items:center;padding-block:6px;overflow-x:auto;scrollbar-width:none}
.subnav-t{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:8px;white-space:nowrap}
.subnav button{border:0;background:none;border-radius:999px;padding:6px 12px;font:500 14px var(--f-body);color:var(--muted);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.subnav button .ic{width:15px;height:15px}
.subnav button:hover{color:var(--ink);background:var(--surface)}
.subnav button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.datebar{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.datebar input{padding:7px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.dlabel{font:600 15px/1 var(--f-disp);letter-spacing:.02em;min-width:9ch}
main{max-width:1520px;margin:0 auto;padding-block:16px 56px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font:600 20px/1.2 var(--f-disp);margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font:600 17px/1.2 var(--f-disp);margin:0;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-variant-numeric:tabular-nums}
.ic{width:16px;height:16px;flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none;padding:5px 7px}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:4px 8px;font-size:13px}
.iconbtn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--ink);border-color:var(--muted)}
.iconbtn.on{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
select.mini{padding:4px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* KPI-strook */
.kpis{display:flex;flex-wrap:wrap;gap:6px 26px;align-items:baseline;padding:12px 16px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font:600 22px/1.1 var(--f-disp)}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi.bad b{color:var(--bad)} .kpi.okk b{color:var(--ok)}
.kpis .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
/* Kenteken */
.plate{display:inline-flex;align-items:stretch;border-radius:3px;overflow:hidden;border:1px solid rgba(0,0,0,.35);font:700 12px/1 var(--f-disp);letter-spacing:.05em;white-space:nowrap;vertical-align:middle}
.plate i{font-style:normal;background:var(--eu);color:#fff;font-size:8px;padding:0 3px;display:flex;align-items:flex-end;padding-bottom:2px}
.plate span{background:var(--plate);color:var(--plate-ink);padding:3px 5px 2px}
/* Tijdlijn */
.tl-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.lg{display:inline-block;width:18px;height:10px;border-radius:2px}
.lg.job{background:var(--muted)}
.lg.drive{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}
.lg.wait{border:1px dashed var(--muted)}
.lg.pause{background:var(--sunk);border:1px solid var(--line)}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tl{min-width:820px}
.tl-row{display:grid;grid-template-columns:210px 1fr;border-top:1px solid var(--line)}
.tl-row:first-child{border-top:0}
.tl-axis{height:28px;position:relative;background:var(--sunk)}
.tl-axis span{position:absolute;top:7px;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.tl-who{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:9px 12px;border-right:1px solid var(--line);min-width:0}
.tl-who:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tl-who b{font:600 15px/1.2 var(--f-disp);display:flex;align-items:center;gap:7px}
.tl-who small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-who.sel{background:var(--accent-soft)}
.tl-who.na{opacity:.6}
.tl-track{position:relative;min-height:64px}
.tl-track.over{background:var(--accent-soft)}
.grid-h{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px)}
.blk{position:absolute;border-radius:4px;overflow:hidden;font-size:12px;line-height:1.15;white-space:nowrap}
.blk.job{top:10px;bottom:10px;background:var(--c);color:var(--on-w);padding:5px 6px;cursor:grab;font-weight:600;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.blk.job small{display:block;font-weight:500;opacity:.88}
.blk.job.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.blk.drive{top:26px;bottom:26px;background:repeating-linear-gradient(135deg,var(--c) 0 2px,transparent 2px 6px);opacity:.75}
.blk.wait{top:22px;bottom:22px;border:1px dashed var(--muted)}
.blk.pause{top:20px;bottom:20px;background:var(--sunk);border:1px solid var(--line);color:var(--muted);font-size:10px;display:grid;place-items:center}
.blk.late{outline:2px solid var(--bad);outline-offset:1px}
.endmark{position:absolute;top:6px;bottom:6px;width:2px;background:var(--ink);opacity:.55}
.overrun{position:absolute;top:4px;bottom:4px;background:var(--bad-soft);border-left:2px solid var(--bad)}
.dragging{opacity:.45}
/* Split */
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.map-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--water)}
.map-wrap svg{display:block;width:100%;height:auto}
.map-ctl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
svg .land{fill:var(--land);stroke:var(--land-line);stroke-width:1.2}
svg .city circle{fill:var(--muted)} svg .city text{fill:var(--muted);font:500 12px var(--f-body)}
svg .leg{fill:none;stroke-width:3.2;stroke-linecap:round}
svg .mk text{font:700 12px var(--f-disp);fill:var(--on-w);text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg .mk{cursor:pointer}
svg .mk-un circle{fill:var(--surface);stroke:var(--muted);stroke-width:2;stroke-dasharray:3 2}
svg .mk-un text{fill:var(--muted)}
svg .depot text{font:700 11px var(--f-disp);fill:var(--surface);text-anchor:middle;dominant-baseline:central}
svg .selring{fill:none;stroke:var(--ink);stroke-width:2.5}
svg .note{font:500 11px var(--f-body);fill:var(--muted)}
/* Rit */
.rt-head{display:grid;gap:6px;margin-bottom:12px}
.wsel{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.wsel button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:13px;font-weight:500}
.wsel button[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px 14px;margin:6px 0 2px}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stats dd{margin:0;font:600 17px/1.2 var(--f-disp)}
.rt{list-style:none;margin:0;padding:0;display:grid}
.rt li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px}
.rt time{font:600 15px/1.3 var(--f-disp);text-align:right;padding-top:2px}
.rt .ev{padding:6px 0}
.rt .ev .lbl{font-weight:600}
.rt .leg-li .lbl{color:var(--muted);font-size:13px;border-left:2px dashed var(--c);margin-left:6px;padding:4px 0 4px 12px}
.rt .pause-li .lbl{color:var(--muted);font-size:13px}
.stop{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:var(--surface);cursor:grab}
.stop.sel{box-shadow:0 0 0 2px var(--c)}
.stop.over,.rt-end.over,.un-zone.over{background:var(--accent-soft)}
.stop-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--on-w);font:700 12px var(--f-disp);flex:none}
.stop-top b{font:600 16px/1.2 var(--f-disp)}
.sub{font-size:13px;color:var(--muted)}
.jobs{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:4px}
.jobs li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:13px;padding:4px 6px;border-radius:4px;background:var(--sunk);cursor:grab}
.jobs li .late{color:var(--bad);font-weight:600}
.stop-act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt-end{border:1px dashed var(--line);border-radius:8px;padding:10px;color:var(--muted);font-size:13px;text-align:center}
/* Ongepland */
.un-zone{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:10px;border-radius:8px;min-height:40px}
.uncard{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;display:grid;gap:6px;cursor:grab;background:var(--surface)}
.ok-line{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;margin-top:8px}
/* Tabellen */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:9px 10px;background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
tr:hover td{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
td.act{white-space:nowrap;text-align:right}
.sec{display:grid;gap:12px}
.msgdlg{width:min(980px,100%);display:grid;grid-template-columns:250px 1fr;gap:0;padding:0;overflow:hidden;max-height:min(88vh,820px)}
.msgside{background:var(--sunk);border-right:1px solid var(--line);overflow:auto;padding:8px;display:grid;align-content:start;gap:4px}
.mth{display:grid;gap:2px;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;cursor:pointer;color:var(--ink);min-width:0}
.mth b{display:flex;gap:7px;align-items:center;font-weight:600}.mth b .tabbadge{margin-left:auto}
.mth small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mth:hover{background:var(--surface)}.mth.sel{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}
.msgmain{display:grid;gap:10px;padding:16px 18px;min-width:0;align-content:start;overflow:auto}
.msgmain .chat{min-height:220px;max-height:min(42vh,400px);display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;border-radius:12px;padding:8px 11px;font-size:14px;display:grid;gap:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub small{font-size:11.5px;opacity:.85;white-space:normal}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:3px}
.bub.me small,.bub.me .muted,.bub.me small span[style]{color:inherit!important}
.bub.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.bub.urg{box-shadow:0 0 0 2px var(--bad)}
.mday{align-self:center;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:4px}
.tbl-wrap tr.grp td{background:var(--sunk);padding:7px 12px;font-size:13.5px}.tbl-wrap tr.grp .btn{margin-left:8px}
.jfbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;margin:4px 0 12px}
.jf{display:grid;gap:3px}.jf span{font:600 11px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

let ORSBUSY=false;
async function fetchORS(dates,opts={}){
  const q=!!opts.quiet,say=m=>{if(!q)toast(m)};
  if(!SERVER){say('OpenRouteService werkt in de Netlify-versie, met ORS_API_KEY in Netlify.');return{got:0}}
  if(ORSBUSY)return{got:0};const pts=orsPointsFor(dates);if(pts.length<2){say('Er zijn nog geen locaties om rijtijden voor op te halen.');return{got:0}}
  D.ors=D.ors||{};const B=40,blocks=[];
  for(let i=0;i<pts.length;i+=B)for(let j=0;j<pts.length;j+=B){const I=pts.slice(i,i+B),J=pts.slice(j,j+B);if(I.some(a=>J.some(b=>a!==b&&!D.ors[orsKey(a,b)])))blocks.push([I,J])}

    for(const [I,J] of blocks){
      say(`Rijtijden ophalen bij OpenRouteService… ${done+1} van ${blocks.length}`);if(opts.onProgress)opts.onProgress(done+1,blocks.length);
      const locs=[],ix=p=>{let k=locs.indexOf(p);if(k<0){locs.push(p);k=locs.length-1}return k};
      const src=I.map(ix),dst=J.map(ix);
      const d=await api('/api/reistijden',{method:'POST',body:JSON.stringify({locations:locs.map(p=>[p.lng,p.lat]),sources:src,destinations:dst})});
      I.forEach((a,r)=>J.forEach((b,c)=>{if(a===b)return;const sec=d.durations&&d.durations[r]&&d.durations[r][c],km=d.distances&&d.distances[r]&&d.distances[r][c];if(sec!=null&&km!=null){D.ors[orsKey(a,b)]=[Math.round(km*10)/10,Math.round(sec/6)/10];got++}}));
      done++;if(done<blocks.length)await new Promise(r=>setTimeout(r,1600));
    }
    D.orsAt=Date.now();LEGS.clear();save();if(!q){render();toast(`${got} rijtijden opgehaald bij OpenRouteService. Klik op Automatisch plannen om de planning erop af te stemmen.`)}return{got};
  }catch(e){
    save();if(q)return{got,error:e};render();
    if(e.code==='pw'){askPw(()=>fetchORS(dates));return{got}}
    toast((done?`${done} van ${blocks.length} delen opgehaald. `:'')+(e.code==='nofn'?'De functie /api/reistijden is niet gevonden. Deploy de site via GitHub, inclusief netlify/functions/reistijden.mjs.':(e.message||'OpenRouteService gaf geen antwoord.'))+' Ontbrekende rijtijden worden geschat.');return{got,error:e};
  }finally{ORSBUSY=false}

const needsPdok=l=>!!l&&l.geo!=='manual'&&l.geo!=='pdok'&&(!!l.address||String(l.postcode||'').replace(/\s/g,'').length===6);

async function pdokLocations(locs,onProgress){
  const todo=locs.filter(needsPdok),fail=[];let ok=0;
  for(let i=0;i<todo.length;i+=20){
    const part=todo.slice(i,i+20);if(onProgress)onProgress(i,todo.length);
    const d=await api('/api/adres',{method:'POST',body:JSON.stringify({items:part.map(l=>({id:l.id,...pdokQuery(l)}))})});
    for(const r of d.results||[]){
      const l=part.find(x=>x.id===r.id);if(!l)continue;
      const a=normTxt(l.city),b=normTxt(r.city),cityOk=!a||!b||a===b||a.includes(b)||b.includes(a);
      if(r.ok&&cityOk&&r.lat>50&&r.lat<54&&r.lng>3&&r.lng<8){l.lat=r.lat;l.lng=r.lng;l.geo='pdok';l.pdokLabel=r.label;delete l.pdokFail;if(!l.postcode&&r.postcode)l.postcode=r.postcode;ok++}

/* Na een Excel-import: exacte posities -> echte rijtijden -> planning, met voortgang */
async function importPipeline(ds,newLocs,msg){
  const steps=[['pdok','Exacte posities opzoeken via PDOK'],['ors','Echte rijtijden ophalen via OpenRouteService'],['plan','Planning maken']];
  const st={pdok:'wacht',ors:useORS()?'wacht':'uit',plan:'wacht'},info={};
  const lab={wacht:'Wacht…',bezig:'Bezig…',klaar:'Klaar',fout:'Niet gelukt',uit:'Overgeslagen'};
  const show=()=>{FORM=null;$('#modal').innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="ipT" style="width:min(560px,100%)"><h3 id="ipT">Import verwerken</h3><p class="note">${esc(msg)}</p>
    <ol class="steps">${steps.map(([k,l])=>`<li class="st-${st[k]}"><b>${l}</b><span>${esc(info[k]||lab[st[k]])}</span></li>`).join('')}</ol>
    <p class="hint">Dit venster sluit vanzelf en toont daarna het importlog.</p></div>`;$('#modal').hidden=false};
  const run=async(k,fn)=>{st[k]='bezig';show();try{await withPw(fn);st[k]='klaar'}catch(e){st[k]='fout';info[k]=apiErr(e)+' De app rekent hier verder met de schatting.'}show()};
  await run('pdok',async()=>{
    const locs=[...new Set([...newLocs,...D.locations.filter(l=>D.jobs.some(j=>j.locationId===l.id&&ds.includes(j.date)))])].filter(needsPdok);
    if(!locs.length){info.pdok='Alle posities waren al exact';return}
    const r=await pdokLocations(locs,(a,b)=>{info.pdok=`${a} van ${b} adressen…`;show()});
    info.pdok=`${r.ok} van ${r.total} adressen exact gevonden${r.fail.length?`; ${r.fail.length} niet gevonden, daar blijft de geschatte positie`:''}`;save()});
  if(useORS())await run('ors',async()=>{const r=await fetchORS(ds,{quiet:true,onProgress:(a,b)=>{info.ors=`Deel ${a} van ${b}…`;show()}});if(r.error)throw r.error;info.ors=r.got?`${r.got} rijtijden opgehaald`:'Alle rijtijden waren al bekend'});
  else info.ors='Staat uit (Instellingen > Bron voor reistijden)';
  await run('plan',async()=>{replan(ds);info.plan=`${ds.length} dag(en) gepland`});
  await new Promise(r=>setTimeout(r,900));
  toast(msg+'.');openLog();
}

/* ---------- dagsimulatie ---------- */
function simulate(w,ids,date){
  const dt=date||(ids.length&&JOB[ids[0]]?JOB[ids[0]].date:null),sh=shiftOf(w,dt);
  const st=D.settings,start=t2m(sh.start)??480,end=t2m(sh.end)??1020,pAt=t2m(st.pauseAt)??720,pm=+st.pauseMin||0;
  let t=start,pos=wPt(w),km=0,trav=0,wait=0,serv=0,pauseDone=pm<=0,late=0,cur=null,depart=start,lastEnd=start;
  if(st.startAtFirst!==false&&ids.length){const j0=JOB[ids[0]],l0=j0&&LOC[j0.locationId];if(l0){const arr=Math.max(start,t2m(j0.from)??start);depart=arr-leg(pos,lPt(l0)).min-(+st.parkMin||0);const mp=st.maxPreTravel==null||st.maxPreTravel===''?60:+st.maxPreTravel;depart=Math.max(depart,start-mp);t=depart}}
  const seg=[],stops=[],lateJobs=[],skillBad=[];
  const pause=()=>{seg.push({k:'pause',a:t,b:t+pm});t+=pm;pauseDone=true};
  /* Pauze is flexibel: alleen nemen als de volgende klussen daardoor niet buiten hun tijdvak vallen */
  const pauseFits=(i,t0,p0)=>{let tt=t0+pm,pp=p0;for(let k=i;k<Math.min(ids.length,i+5);k++){const jj=JOB[ids[k]],ll=jj&&LOC[jj.locationId];if(!ll)continue;const q=lPt(ll);if(q.key!==pp.key){tt+=leg(pp,q).min+(+st.parkMin||0);pp=q}const a=t2m(jj.from),b=t2m(jj.to);if(a!=null&&tt<=a)return true;tt+=jobDur(jj);if(b!=null&&tt>b+.5)return false}return true};
  for(let i=0;i<ids.length;i++){const id=ids[i];
    const j=JOB[id];if(!j)continue;const l=LOC[j.locationId];if(!l)continue;
    if(!skillOk(w,j))skillBad.push(id);
    const p=lPt(l);
    if(p.key!==pos.key){
      if(!pauseDone&&stops.length&&t>=pAt&&pauseFits(i,t,pos))pause();
      const g=leg(pos,p),mins=g.min+(+st.parkMin||0);
      seg.push({k:'drive',a:t,b:t+mins,km:g.km});t+=mins;km+=g.km;trav+=mins;pos=p;
      cur={loc:l,arrive:t,travel:mins,km:g.km,jobs:[],start:null,end:null,wait:0,late:false};stops.push(cur);
    }
    const ws=t2m(j.from),we=t2m(j.to);
    if(ws!=null&&t<ws){seg.push({k:'wait',a:t,b:ws});wait+=ws-t;cur.wait+=ws-t;if(!pauseDone&&ws-t>=pm&&ws>pAt)pauseDone=true;t=ws}
    else if(!pauseDone&&t>=pAt&&cur.jobs.length&&pauseFits(i,t,pos))pause();
    const d=jobDur(j),s=t,e=t+d,isLate=we!=null&&e>we+.5;
    seg.push({k:'job',a:s,b:e,id,late:isLate});serv+=d;t=e;
    if(isLate){late+=e-we;lateJobs.push(id);cur.late=true}
    cur.jobs.push(id);if(cur.start==null)cur.start=s;cur.end=e;
  }
  if(stops.length){
    if(!pauseDone&&t-start>(+st.pauseMinDay||330))pause();
    lastEnd=t;
    const g=leg(pos,wPt(w));seg.push({k:'return',a:t,b:t+g.min,km:g.km});t+=g.min;km+=g.km;trav+=g.min;
  }
  const finish=stops.length?t:start;
  const endRef=st.endAtLast===true&&stops.length?lastEnd:finish;
  return{seg,stops,km,trav,wait,serv,start,end,depart,finish,over:Math.max(0,endRef-end),late,lateJobs,skillBad,n:ids.length};
}
const costOf=s=>s.stops.length?s.trav+D.settings.kmWeight*s.km:0;
const violOf=s=>s.late+s.over+s.skillBad.length*1000;
const feas=s=>violOf(s)<.5;
const penal=s=>costOf(s)+violOf(s)*8;

/* ---------- optimalisatie ---------- */
function bestPos(w,route,ids,strict){
  let best=null;
  for(let p=0;p<=route.length;p++){
    const arr=route.slice(0,p).concat(ids,route.slice(p));const s=simulate(w,arr);
    if(strict&&!feas(s))continue;const c=strict?costOf(s):penal(s);
    if(!best||c<best.c)best={c,p,arr,s};
  }
  return best;
}
function blocksOf(r){const b=[];for(const id of r){const l=JOB[id]?JOB[id].locationId:null;if(b.length&&b[b.length-1].loc===l)b[b.length-1].ids.push(id);else b.push({loc:l,ids:[id]})}return b}
function insertLoop(rest,R,ws){
  const base={};const upd=wid=>base[wid]=costOf(simulate(WRK[wid],R[wid]));ws.forEach(w=>upd(w.id));
  rest=[...rest];
  while(rest.length){
    let pick=null;
    for(const id of rest){
      const j=JOB[id],opts=[];
      for(const w of ws){if(!skillOk(w,j))continue;const b=bestPos(w,R[w.id],[id],true);if(b)opts.push({w:w.id,arr:b.arr,d:b.c-base[w.id]})}
      if(!opts.length)continue;
      opts.sort((a,b)=>a.d-b.d);
      const regret=opts.length>1?opts[1].d-opts[0].d:300;
      const score=(+j.priority||2)*1e6+Math.min(regret,999)*100-opts[0].d;
      if(!pick||score>pick.score)pick={id,score,o:opts[0]};
    }
    if(!pick)break;
    R[pick.o.w]=pick.o.arr;upd(pick.o.w);rest.splice(rest.indexOf(pick.id),1);
  }
}
function better(vN,cN,vO,cO){return vN<vO-.5||(vN<=vO+.01&&cN<cO-.5)}
function improve(R,ws,pins,within){
  const C={};const ev=wid=>{const s=simulate(WRK[wid],R[wid]);return{c:costOf(s),v:violOf(s)}};
  ws.forEach(w=>C[w.id]=ev(w.id));
  let it=0,changed=true;
  while(changed&&it<60){changed=false;it++;
    outer:for(const A of ws){
      const ra=R[A.id],blocks=blocksOf(ra);
      for(const blk of blocks){
        const rem=ra.filter(id=>!blk.ids.includes(id));const rs=simulate(A,rem),rc=costOf(rs),rv=violOf(rs);
        const pinned=blk.ids.some(id=>pins[id]===A.id);
        const targets=(within||pinned)?[A]:ws;
        for(const B of targets){
          if(B.id!==A.id&&blk.ids.some(id=>!skillOk(B,JOB[id])))continue;
          const rb=B.id===A.id?rem:R[B.id];
          for(let p=0;p<=rb.length;p++){
            const arr=rb.slice(0,p).concat(blk.ids,rb.slice(p));const s=simulate(B,arr),c=costOf(s),v=violOf(s);
            let ok;
            if(B.id===A.id)ok=better(v,c,C[A.id].v,C[A.id].c);
            else ok=better(rv+v,rc+c,C[A.id].v+C[B.id].v,C[A.id].c+C[B.id].c);
            if(ok){if(B.id===A.id)R[A.id]=arr;else{R[A.id]=rem;R[B.id]=arr;C[B.id]=ev(B.id)}C[A.id]=ev(A.id);changed=true;break outer}
          }
        }
      }
      if(!within)for(const B of ws){if(B.id<=A.id)continue;
        for(const a of blocksOf(R[A.id])){if(a.ids.some(id=>pins[id]===A.id||!skillOk(B,JOB[id])))continue;
          for(const b of blocksOf(R[B.id])){if(b.ids.some(id=>pins[id]===B.id||!skillOk(A,JOB[id])))continue;
            const nA=bestPos(A,R[A.id].filter(id=>!a.ids.includes(id)),b.ids,false),nB=bestPos(B,R[B.id].filter(id=>!b.ids.includes(id)),a.ids,false);
            const vN=violOf(nA.s)+violOf(nB.s),cN=costOf(nA.s)+costOf(nB.s);
            if(better(vN,cN,C[A.id].v+C[B.id].v,C[A.id].c+C[B.id].c)){R[A.id]=nA.arr;R[B.id]=nB.arr;C[A.id]=ev(A.id);C[B.id]=ev(B.id);changed=true;break outer}
          }
        }
      }
      const bl=blocksOf(R[A.id]);
      for(let i=0;i<bl.length-1;i++)for(let k=i+1;k<bl.length;k++){
        const nb=bl.slice(0,i).concat(bl.slice(i,k+1).reverse(),bl.slice(k+1));const arr=nb.flatMap(b=>b.ids);
        const s=simulate(A,arr);if(better(violOf(s),costOf(s),C[A.id].v,C[A.id].c)){R[A.id]=arr;C[A.id]=ev(A.id);changed=true;break outer}
      }
    }
  }
}
/* Meer voertuigen kwijt kunnen: haal een stop uit een rit, zet een ongeplande groep erin en plaats de stop elders terug */
function eject(R,ws,pins,jobs){
  for(let round=0;round<8;round++){
    const inR=new Set(Object.values(R).flat()),groups={};
    jobs.filter(j=>!inR.has(j.id)).sort((a,b)=>(+b.priority||2)-(+a.priority||2)).forEach(j=>(groups[j.locationId]=groups[j.locationId]||[]).push(j.id));
    const cand=Object.values(groups).flatMap(g=>g.length>1?[g,...g.map(x=>[x])]:[g]);
    let gain=false;
    tryAll:for(const G of cand){
      for(const A of ws){if(G.some(id=>!skillOk(A,JOB[id])))continue;const b=bestPos(A,R[A.id],G,true);if(b){R[A.id]=b.arr;gain=true;break tryAll}}
      for(const A of ws){if(G.some(id=>!skillOk(A,JOB[id])))continue;
        for(const blk of blocksOf(R[A.id])){if(blk.ids.some(id=>pins[id]===A.id))continue;
          const rem=R[A.id].filter(id=>!blk.ids.includes(id));const bA=bestPos(A,rem,G,true);if(!bA)continue;
          let placed=null;
          for(const B of ws){if(blk.ids.some(id=>!skillOk(B,JOB[id])))continue;const base=B.id===A.id?bA.arr:R[B.id];const bb=bestPos(B,base,blk.ids,true);if(bb&&(!placed||bb.c<placed.c))placed={w:B.id,arr:bb.arr,c:bb.c}}
          if(placed){R[A.id]=bA.arr;R[placed.w]=placed.arr;gain=true;break tryAll}
        }
      }
    }
    if(!gain)break;
  }
}
function getPlan(date){D.plans[date]=D.plans[date]||{routes:{},pinned:{}};const P=D.plans[date];P.routes=P.routes||{};P.pinned=P.pinned||{};return P}
const hasPlan=date=>!!(D.plans[date]&&(D.plans[date].auto||D.plans[date].edited));
function cleanPlan(date){
  const P=getPlan(date),ok=new Set(jobsOn(date).map(j=>j.id)),seen=new Set();
  for(const wid of Object.keys(P.routes)){if(!WRK[wid]){delete P.routes[wid];continue}P.routes[wid]=P.routes[wid].filter(id=>ok.has(id)&&!seen.has(id)&&seen.add(id))}
  for(const id of Object.keys(P.pinned))if(!ok.has(id)||!WRK[P.pinned[id]])delete P.pinned[id];
  return P;
}
function autoPlan(date){
  const P=cleanPlan(date),jobs=jobsOn(date),ws=D.workers.filter(w=>avail(w,date)),pins=P.pinned;
  const R={};ws.forEach(w=>R[w.id]=[]);
  const byWin=(a,b)=>(t2m(a.from)??0)-(t2m(b.from)??0);
  const pj=jobs.filter(j=>pins[j.id]&&R[pins[j.id]]).sort(byWin);
  for(const j of pj){const wid=pins[j.id];const b=bestPos(WRK[wid],R[wid],[j.id],true)||bestPos(WRK[wid],R[wid],[j.id],false);R[wid]=b.arr}
  insertLoop(jobs.filter(j=>!(pins[j.id]&&R[pins[j.id]])).map(j=>j.id),R,ws);
  improve(R,ws,pins,false);
  const inR=()=>new Set(Object.values(R).flat());
  let left=jobs.map(j=>j.id).filter(id=>!inR().has(id));
  if(left.length){insertLoop(left,R,ws);improve(R,ws,pins,false);eject(R,ws,pins,jobs);improve(R,ws,pins,false)}
  P.routes=R;P.auto=Date.now();P.edited=0;
  return P;
}
function whyUnplanned(j,date){
  const ws=D.workers.filter(w=>avail(w,date));
  if(!ws.length)return'Geen medewerker beschikbaar op deze dag';
  const sk=jobSkill(j);const cap=ws.filter(w=>skillOk(w,j));
  if(!cap.length)return`Geen beschikbare medewerker met vaardigheid "${sk}"`;
  if(!cap.some(w=>feas(simulate(w,[j.id])))){
    let b=null;for(const w of cap){const s=simulate(w,[j.id]);if(!b||violOf(s)<b.v)b={w,s,v:violOf(s)}}
    const p=b.s.stops[0];
    if(p&&j.to&&b.s.late>.5)return`Niemand is op tijd: snelste is ${b.w.name.split(' ')[0]} (start ${b.w.start}, aankomst ${m2t(p.arrive)}, klaar ${m2t(p.end)}), maar venster eindigt om ${j.to}. Ruimer venster of medewerker dichterbij nodig`;
    if(b.s.over>.5)return`Past niet binnen werktijd: zelfs ${b.w.name.split(' ')[0]} is pas om ${m2t(b.s.finish)} terug (eindtijd ${b.w.end})`;
    return'Past niet binnen werktijd en tijdvenster, ook niet als enige opdracht';
  }
  return'Onvoldoende capaciteit binnen werktijden en tijdvensters';
}

/* ---------- handmatige aanpassingen ---------- */
function moveJobs(ids,wid,before){
  const P=getPlan(S.date);
  for(const k of Object.keys(P.routes))P.routes[k]=P.routes[k].filter(id=>!ids.includes(id));
  if(!wid){ids.forEach(id=>delete P.pinned[id])}
  else{
    const r=P.routes[wid]=P.routes[wid]||[];
    if(before==='best'){const b=bestPos(WRK[wid],r,ids,true)||bestPos(WRK[wid],r,ids,false);P.routes[wid]=b.arr}
    else if(before){const i=r.indexOf(before);r.splice(i<0?r.length:i,0,...ids)}
    else r.push(...ids);
    ids.forEach(id=>P.pinned[id]=wid);
  }
  P.edited=Date.now();save();render();
  toast(wid?`Verplaatst naar ${WRK[wid].name} en vastgezet. Tijden en route zijn herberekend.`:'Uit de planning gehaald.');
}
function bestWorkerFor(ids){
  const date=S.date,P=getPlan(date),ws=D.workers.filter(w=>avail(w,date));let best=null;
  for(const w of ws){const r=P.routes[w.id]||[],b0=simulate(w,r);const b=bestPos(w,r,ids,true);if(b){const d=b.c-costOf(b0);if(!best||d<best.d)best={w:w.id,d}}}
  return best&&best.w;
}

/* ---------- slim voorstel: doorrekenen van alternatieven ---------- */
let PROP=null,SAMPLE=null,AICTL=null;
function proposeFor(ids,date){
  const js=ids.map(id=>JOB[id]).filter(Boolean);if(!js.length)return[];
  const today=new Date().toISOString().slice(0,10),kw=D.settings.kmWeight||0;
  const routesFor=d=>{if(d!==date&&jobsOn(d).length&&!hasPlan(d))autoPlan(d);const P=D.plans[d],R={};D.workers.filter(w=>avail(w,d)).forEach(w=>R[w.id]=((P&&P.routes&&P.routes[w.id])||[]).filter(id=>!ids.includes(id)));return R};
  const span=s=>{const g=s.seg.filter(x=>x.k==='job'&&ids.includes(x.id));const m={};g.forEach(x=>m[x.id]=[x.a,x.b]);return{st:Math.min(...g.map(x=>x.a)),en:Math.max(...g.map(x=>x.b)),m}};
  const froms=js.map(j=>t2m(j.from)).filter(x=>x!=null),tos=js.map(j=>t2m(j.to)).filter(x=>x!=null);
  const f0=froms.length?Math.min(...froms):null,t0=tos.length?Math.max(...tos):null;
  const shift=[],day=[];
  {const R=routesFor(date),saved=js.map(j=>[j.from,j.to]);
    /* Schuif het hele tijdvak in stappen van 5 minuten, zo dicht mogelijk bij het gevraagde tijdstip (max. 2 uur) */
    const offs=[0];if(f0!=null||t0!=null)for(let m=5;m<=120;m+=5)offs.push(m,-m);
    try{for(const wid in R){const w=WRK[wid];if(js.some(j=>!skillOk(w,j)))continue;const base=simulate(w,R[wid]);let best=null;
        for(const k of offs){if(best&&Math.abs(k)>best.dev+.5)break;
          if(js.some((j,i)=>{const a=t2m(saved[i][0]),b=t2m(saved[i][1]);return(a!=null&&a+k<0)||(b!=null&&b+k>1439)}))continue;
          js.forEach((j,i)=>{const a=t2m(saved[i][0]),b=t2m(saved[i][1]);j.from=a!=null?m2t(a+k):'';j.to=b!=null?m2t(b+k):''});
          for(let p=0;p<=R[wid].length;p++){const arr=R[wid].slice(0,p).concat(ids,R[wid].slice(p));const s=simulate(w,arr);if(!feas(s))continue;
            const{st,en,m}=span(s);const dev=Math.abs(k),dtrav=s.trav-base.trav,dkm=s.km-base.km,score=dev*2+dtrav+kw*dkm;
            if(!best||score<best.score)best={kind:'shift',date,wid,arr,start:st,end:en,segs:m,dev,early:k<0,dtrav,dkm,score}}}
        if(best)shift.push(best)}
    }finally{js.forEach((j,i)=>{j.from=saved[i][0];j.to=saved[i][1]})}
  }
  for(let k=-7;k<=14;k++){if(!k)continue;const d=addDays(date,k);if(d<today)continue;const R=routesFor(d);let best=null;const sd=js.map(j=>j.date);js.forEach(j=>j.date=d);
    try{for(const wid in R){const w=WRK[wid];if(js.some(j=>!skillOk(w,j)))continue;const base=simulate(w,R[wid]);const b=bestPos(w,R[wid],ids,true);if(!b)continue;
      const{st,en,m}=span(b.s);const dtrav=b.s.trav-base.trav,dkm=b.s.km-base.km,score=Math.abs(k)*25+dtrav+kw*dkm;
      if(!best||score<best.score)best={kind:'day',date:d,wid,arr:b.arr,start:st,end:en,segs:m,dev:0,dtrav,dkm,score,days:k}}
    }finally{js.forEach((j,i)=>j.date=sd[i])}
    if(best)day.push(best)}
  shift.sort((a,b)=>a.score-b.score);day.sort((a,b)=>a.score-b.score);
  return shift.slice(0,4).concat(day.slice(0,3));
}
/* Waarom kan een medewerker deze klus niet op het gevraagde tijdstip doen? */
function verdict(w,ids,date,route){
  const why=availWhy(w,date),js=ids.map(id=>JOB[id]);

function dayState(){

  const sims={};rows.forEach(w=>sims[w.id]=simulate(w,P.routes[w.id]||[],date));
  const planned=new Set(rows.flatMap(w=>P.routes[w.id]||[]));

}

function fixGeo(v,old){
  const pcChanged=old&&((v.address!==undefined&&(old.address||'')!==(v.address||''))||(old.postcode||'')!==(v.postcode||'')||(v.city!==undefined&&(old.city||'')!==(v.city||'')));
  if(v.lat!==''&&v.lng!==''&&!(pcChanged&&old.geo!=='manual'&&+v.lat===+old.lat)){v.lat=+v.lat;v.lng=+v.lng;v.geo=(old&&old.geo&&+old.lat===v.lat&&+old.lng===v.lng)?old.geo:'manual';if(v.lat<50||v.lat>54||v.lng<3||v.lng>8)return'Coördinaten liggen buiten Nederland. Controleer breedte- en lengtegraad.';return''}
  const g=geocode(v.postcode,v.city);if(!g)return'Postcode en plaats niet herkend. Vul een Nederlandse postcode in (bijv. 5301 LK) of geef coördinaten op.';
  Object.assign(v,g);return'';
}

function xTime(v){

function logCsv(){
  const rows=logFiltered(liveEntries(LOGSRC)),q=v=>{const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const lines=[['Rij','Kenteken','Klant','Plaats','Periode','Datum','Tijdslot','Status','Toelichting','Opmerking'].join(';')].concat(rows.map(e=>[e.row,e.plate,e.cust,e.city,e.per,e.date,e.time,(LOGST[e.st]||[e.st])[0],e.reason,e.note].map(q).join(';')));
  copyText(lines.join('\n'),`${rows.length} regels gekopieerd. Plak ze in Excel.`);
}

function copyText(t,okMsg){const done=()=>toast(okMsg);try{navigator.clipboard.writeText(t).then(done,()=>showCopy(t))}catch(e){showCopy(t)}}
function showCopy(t){openForm({title:'Back-up',note:'Selecteer de tekst en kopieer hem.',fields:[{k:'csv',label:'Gegevens (JSON)',type:'textarea'}],values:{csv:t},onSave:()=>''});setTimeout(()=>{const a=$('#f_csv');if(a){a.select()}},20)}

/* ---------- events ---------- */
function onClick(e){
  if(!e.target.closest('.navg'))closeMenus();
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(el.tagName==='SELECT')return;
  if(a==='sel'&&e.target.closest('select,button:not([data-act="sel"])'))return;
  switch(a){
    case'tab':S.tab=el.dataset.k;render();window.scrollTo(0,0);break;
    case'navto':navTo(el.dataset.to);break;
    case'menuup':case'menudown':{const m=menuCfg(),w=el.dataset.w,list=w==='top'?m.top:w==='hidden'?m.hidden:m.groups[w.slice(2)].items;menuShift(list,el.dataset.id,a==='menuup'?-1:1);save();render();break}
    case'menunewg':{const m=menuCfg(),k=uid('g');m.groups[k]={l:'Nieuwe groep',items:[]};m.top.push('g:'+k);save();render();const i=document.querySelector(`[data-menuname="${k}"]`);if(i){i.focus();i.select()}break}
    case'menudelg':{const m=menuCfg(),k=el.dataset.k;if(m.groups[k]&&!m.groups[k].items.length){delete m.groups[k];m.top=m.top.filter(x=>x!=='g:'+k);save();render()}break}
    case'menureset':D.menu=menuDefault();save();render();toast('Standaardindeling hersteld.');break;
    case'navg':{const g=el.closest('.navg'),open=!g.classList.contains('open');closeMenus();if(open){g.classList.add('open');el.setAttribute('aria-expanded','true');const f=g.querySelector('[role=menuitem]');if(f&&e.detail===0)f.focus()}break}
    case'day':S.date=addDays(S.date,+el.dataset.d);S.selLoc=null;save();render();break;
    case'auto':autoPlan(S.date);save();render();toast('Planning automatisch opnieuw gemaakt. Vastgezette bezoeken zijn gerespecteerd.');break;
    case'unpinall':{const P=getPlan(S.date);P.pinned={};P.edited=Date.now();save();render();toast('Alle vastzettingen opgeheven. Klik Automatisch plannen om vrij te optimaliseren.');break}
    case'selw':S.wid=el.dataset.wid;S.selLoc=null;render();break;
    case'sel':S.wid=el.dataset.wid;S.selLoc=S.selLoc===el.dataset.loc?null:el.dataset.loc;render();break;
    case'mapmode':S.mapMode=el.dataset.k;render();break;
    case'seqopt':{const P=getPlan(S.date),w=WRK[el.dataset.wid];const before=simulate(w,P.routes[w.id]||[]);const R={[w.id]:[...(P.routes[w.id]||[])]};improve(R,[w],P.pinned,true);P.routes[w.id]=R[w.id];P.edited=Date.now();const after=simulate(w,R[w.id]);save();render();toast(after.trav<before.trav?`Volgorde verbeterd: ${fdur(before.trav-after.trav)} minder rijtijd.`:'De huidige volgorde is al optimaal.');break}
    case'mv':{const P=getPlan(S.date),wid=el.dataset.wid,ids=el.dataset.ids.split(','),r=P.routes[wid];const bl=blocksOf(r);const i=bl.findIndex(b=>b.ids[0]===ids[0]);const j=i+(+el.dataset.dir);if(i<0||j<0||j>=bl.length)return;[bl[i],bl[j]]=[bl[j],bl[i]];P.routes[wid]=bl.flatMap(b=>b.ids);ids.forEach(id=>P.pinned[id]=wid);P.edited=Date.now();save();render();toast('Volgorde aangepast, tijden herberekend.');break}
    case'pin':{const P=getPlan(S.date),wid=el.dataset.wid,ids=el.dataset.ids.split(',');const all=ids.every(id=>P.pinned[id]===wid);ids.forEach(id=>{if(all)delete P.pinned[id];else P.pinned[id]=wid});save();render();toast(all?'Losgemaakt: de planner mag dit bezoek weer verplaatsen.':'Vastgezet bij '+WRK[wid].name+'.');break}
    case'jobscope':S.jobScope=el.dataset.k;render();break;
    case'newjob':editJob(null);break;case'editjob':editJob(el.dataset.id);break;
    case'import':openXlsxImport();break;
    case'csvimport':openImport();break;
    case'xdo':doXImport();break;
    case'openlog':openLog();break;
    case'logf':LOGF.st=el.dataset.k;logRefresh();break;
    case'logfix':openLogFix(el.dataset.i);break;
    case'logmove':openLogMove(el.dataset.i);break;
    case'loggo':logGoto(el.dataset.i);break;
    case'logdone':{const e=logEntry(el.dataset.i);if(e){e.done=!e.done;save();logRefresh()}break}
    case'logbulk':openLogBulk();break;
    case'logbulkdone':{let n=0;for(const i of LOGSEL){const e=logEntry(i);if(e&&PROBLEM.has(liveEntries({entries:[e]})[0].st)){e.done=true;n++}}LOGSEL=new Set();save();logRefresh();toast(`${n} regel(s) afgehandeld.`);break}
    case'jfgoto':S.date=el.dataset.date;S.wid=el.dataset.wid;S.tab='planning';render();setTimeout(()=>{const r=document.querySelector('.split');if(r)r.scrollIntoView({behavior:'smooth',block:'start'})},50);break;
    case'jfclear':S.jf={...JF0,sort:jf().sort};render();break;
    case'logclr':LOGSEL=new Set();logRefresh();break;
    case'logdel':if(el.dataset.armed){const lg=curLog();D.importLogs=importLogs().filter(x=>x!==lg);S.logId=null;LOGSRC=null;save();render();toast('Log verwijderd; de opdrachten blijven staan.')}else{el.dataset.armed='1';el.textContent='Klik nogmaals om te verwijderen'}break;
    case'ximport':openXlsxImport();break;
    case'logcsv':logCsv();break;
    case'xlog':{const box=$('#xlogBox');if(box.innerHTML){box.innerHTML='';el.textContent=`Bekijk alle regels per voertuig (${XIMP.log.length})`}else{LOGSRC={entries:XIMP.log,preview:true};LOGF={st:'alle',q:'',m:''};box.innerHTML=logShell();logRefresh();el.textContent='Verberg regels'}break}
    case'publish':openPublish();break;
    case'wlink':copyWorkerLink(el.dataset.id);break;
    case'visit':S.wid=el.dataset.wid;S.selLoc=el.dataset.loc;openVisit(el.dataset.wid,el.dataset.loc);break;
    case'repf':S.repF=el.dataset.k;render();break;
    case'handled':{D.handled=D.handled||{};if(D.handled[el.dataset.id])delete D.handled[el.dataset.id];else D.handled[el.dataset.id]=Date.now();save();render();break}
    case'refreshst':fetchStatus(S.date,true).then(()=>{render();toast('Meldingen bijgewerkt.')});break;
    case'copymsg':if(PROP&&PROP.ai)copyText(PROP.ai.msg,'Bericht gekopieerd.');break;
    case'sick':openSick(el.dataset.id);break;
    case'sickundo':sickUndo();break;
    case'unsick':openUnsick(el.dataset.id);break;
    case'sickclose':if(SICK){delete SICK.snap;save()}SICK=null;closeForm();render();break;
    case'sickview':{const K=(D.sickLog||[]).find(x=>x.id===el.dataset.id);if(K){delete K.snap;save();SICK=K;openSickResult()}break}
    case'sickai':sickAI();break;
    case'sickapply':sickApply([+el.dataset.g]);break;
    case'sickapplyall':sickApply(SICK&&SICKAI[SICK.id]?SICKAI[SICK.id].picks.map(p=>p.g):[]);break;
    case'sickcopy':if(SICK&&SICKAI[SICK.id])copyText(SICKAI[SICK.id].msgs[+el.dataset.g]||'','Bericht gekopieerd.');break;
    case'combopick':comboPick(el.dataset.k,el.dataset.v);break;
    case'chat':openChat(el.dataset.id);break;
    case'chatquick':chatSend(el.dataset.q);break;
    case'chatapply':chatApply(+el.dataset.m,+el.dataset.i);break;
    case'orsfetch':fetchORS(el.dataset.date?[el.dataset.date]:null);break;
    case'pdok':pdokImprove();break;
    case'orsclear':D.ors={};D.orsAt=null;save();render();toast('Opgehaalde rijtijden gewist; de schatting wordt weer gebruikt.');break;
    case'msgs':openMsgs({wid:el.dataset.wid,ref:el.dataset.ref});break;
    case'msgw':{const t=$('#msgTxt');if(t)MV.draft=t.value;MV.wid=el.dataset.wid;markSeen(MV.wid);renderMsgs();break}
    case'msgtpl':{const t=$('#msgTxt');t.value=(t.value?t.value.trim()+' ':'')+MSGT[+el.dataset.i];t.focus();const k=t.value.indexOf('{tijd}');if(k>=0)t.setSelectionRange(k,k+6);break}
    case'msgsend':sendMsg();break;
    case'msgnoref':{const t=$('#msgTxt');if(t)MV.draft=t.value;MV.ref='';renderMsgs();break}
    case'msgref':fetchMsgs(true).then(()=>{if(MSG.err==='pw'){const w=MV&&MV.wid;askPw(()=>{openMsgs({wid:w})})}else renderMsgs()});break;
    case'msgclose':closeForm();render();break;
    case'absnew':openAbs(null,{wid:el.dataset.wid,date:el.dataset.date});break;
    case'absedit':openAbs(el.dataset.id);break;
    case'absmonth':{const ym=S.absMonth||S.date.slice(0,7);S.absMonth=addDays(ym+'-15',+el.dataset.d*30).slice(0,7);render();break}
    case'absscope':S.absScope=el.dataset.k;render();break;
    case'absgo':{const P=ABSPEND;ABSPEND=null;if(!P)break;closeForm();if(el.dataset.mode==='redis'){runSick(P.rec.wid,P.rec.from,P.rec.to,ABS[P.rec.type].name+(P.rec.note?' \u2013 '+P.rec.note:''),{rec:P.rec})}else absStore(P.rec,P.old);break}
    case'absredis':{const a=(D.absences||[]).find(x=>x.id===el.dataset.id);if(a)runSick(a.wid,a.from<todayIso()?todayIso():a.from,a.to,ABS[a.type].name+(a.note?' \u2013 '+a.note:''),{existing:true,type:a.type});break}
    case'propose':{const fs=!!$('#skT');openPropose(el.dataset.ids.split(','));if(PROP)PROP.fromSick=fs;break}
    case'extend':{const w=WRK[el.dataset.wid],d=PROP.date,ids=PROP.ids;w.overrides=w.overrides||{};w.overrides[d]={start:el.dataset.start,end:el.dataset.end,note:'Incidenteel langer'};
      const P=getPlan(d);for(const k of Object.keys(P.routes))P.routes[k]=P.routes[k].filter(id=>!ids.includes(id));
      const b=bestPos(w,P.routes[w.id]||[],ids,true)||bestPos(w,P.routes[w.id]||[],ids,false);P.routes[w.id]=b.arr;ids.forEach(id=>P.pinned[id]=w.id);P.edited=Date.now();if(!P.auto)P.auto=Date.now();
      const g=b.s.seg.find(x=>x.k==='job'&&x.id===ids[0]);if(AICTL)AICTL.abort();closeForm();PROP=null;S.wid=w.id;save();render();
      toast(`${w.name} werkt op ${fdate(d,{weekday:'short',day:'numeric',month:'short'})} incidenteel ${el.dataset.start}–${el.dataset.end}. Ingepland om ${g?m2t(g.a):''} en gemarkeerd.`);break}
    case'ovr':editOvr(el.dataset.wid,S.date);break;
    case'papply':applyProp(+el.dataset.i);break;
    case'askai':askAI();break;
    case'aistop':if(AICTL)AICTL.abort();break;
    case'newcus':editCus(null);break;case'editcus':editCus(el.dataset.id);break;
    case'newloc':editLoc(null);break;case'editloc':editLoc(el.dataset.id);break;
    case'neww':editW(null);break;case'editw':editW(el.dataset.id);break;
    case'edittype':editType(el.dataset.id||null);break;
    case'saveset':{document.querySelectorAll('[data-set]').forEach(i=>{const k=i.dataset.set;D.settings[k]=i.type==='checkbox'?i.checked:i.type==='number'?(+i.value||0):i.value});replan(Object.keys(D.plans));toast('Instellingen opgeslagen, planningen opnieuw berekend.');break}
    case'export':copyText(JSON.stringify(D),'Back-up gekopieerd naar het klembord.');break;
    case'restore':openForm({title:'Back-up terugzetten',okLabel:'Terugzetten',note:'Plak een eerder gekopieerde back-up. Dit vervangt alle huidige gegevens.',fields:[{k:'csv',label:'Back-up (JSON)',type:'textarea'}],values:{},onSave:v=>{try{const x=JSON.parse(v.csv);if(!x.version||!x.jobs)throw 0;D=x;save();render();toast('Back-up teruggezet.')}catch(e){return'Dit is geen geldige back-up.'}}});break;
    case'reset':if(el.dataset.armed){D=sample();S.date='2026-10-29';save();render();toast('Voorbeelddata hersteld.')}else{el.dataset.armed='1';el.textContent='Klik nogmaals: alles wordt vervangen';setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent='Voorbeelddata herstellen'}},4000)}break;
    case'dlgx':if(AICTL)AICTL.abort();if(PROP&&PROP.fromSick&&SICK){PROP=null;openSickResult();break}closeForm();break;
    case'dlgdel':if(el.dataset.armed){const f=FORM.onDelete;closeForm();f()}else{el.dataset.armed='1';el.textContent='Klik nogmaals om te verwijderen';if(FORM.delNote)showErr(FORM.delNote)}break;
  }
}
function onChange(e){
  const el=e.target;
  if(el.id==='xf'&&el.files&&el.files[0])return readXlsx(el.files[0]);
  if((el.id==='xclear'||el.id==='xfuture')&&XIMP)return renderXPrev();
  if(el.dataset.xname!=null&&XIMP){XIMP.names=Object.assign({},XIMP.names,{[el.dataset.xname]:el.value});return xReparse()}
  if(el.id==='xcust'&&XIMP){XIMP.custEdit=el.value;return xReparse()}
  if(el.dataset.menuloc){menuMove(el.dataset.menuloc,el.value);save();render();toast(`${MENU_ITEMS[el.dataset.menuloc][0]} staat nu ${el.value==='top'?'in het hoofdmenu':el.value==='hidden'?'verborgen':'onder '+menuCfg().groups[el.value.slice(2)].l}.`);return}
  if(el.dataset.menuname){const g=menuCfg().groups[el.dataset.menuname];if(g){g.l=el.value.trim()||g.l;save();render()}return}
  if(el.id==='logM'){LOGF.m=el.value;return logRefresh()}
  if(el.id==='logC'){LOGF.c=el.value;return logRefresh()}
  if(el.id==='logSort'){LOGF.sort=el.value;return logRefresh()}
  if(el.id==='logFrom'){LOGF.from=el.value;return logRefresh()}
  if(el.id==='logTo'){LOGF.to=el.value;return logRefresh()}
  if(el.dataset.jf){jf()[el.dataset.jf]=el.value;const t=$('#jobsTbl');if(t)t.innerHTML=jobsTable();if(el.dataset.jf!=='sort'){const bar=document.querySelector('.jfbar');if(bar)bar.outerHTML=jobFilterBar()}return}
  if(el.id==='logPick'){S.logId=el.value;LOGSRC=null;LOGF={st:'probleem',q:'',m:'',c:''};return render()}
  if(el.dataset.logsel!=null){const i=+el.dataset.logsel;if(el.checked)LOGSEL.add(i);else LOGSEL.delete(i);return logBulkBar()}
  if(el.id==='logAll'){const rows=logFiltered(liveEntries(LOGSRC)).slice(0,500);rows.forEach(e=>el.checked?LOGSEL.add(e.i):LOGSEL.delete(e.i));return logRefresh()}
  if(el.dataset.msgsel&&MV){if(el.checked)MV.sel.add(el.dataset.msgsel);else MV.sel.delete(el.dataset.msgsel);return}
  if(el.id==='msgUrg'&&MV){MV.urgent=el.checked;return}
  if(el.dataset.absf){if(el.dataset.absf==='w')S.absW=el.value;else S.absT=el.value;return render()}
  if(el.id==='dateIn'&&el.value){S.date=el.value;S.selLoc=null;save();render();return}
  if(el.dataset.act==='moveto'&&el.value){const ids=el.dataset.ids.split(',');let w=el.value;
    if(w==='__un')return moveJobs(ids,null);
    if(w==='__best'){w=bestWorkerFor(ids);if(!w){toast('Bij niemand past dit binnen werktijd en tijdvenster. Kies zelf een medewerker om toch in te plannen.');el.value='';return}}
    moveJobs(ids,w,'best')}
}
let DRAG=null;
function onDragStart(e){const el=e.target.closest&&e.target.closest('[data-drag]');if(!el)return;DRAG=el.dataset.drag.split(',');try{e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move'}catch(x){}el.classList.add('dragging');e.stopPropagation()}
function clearOver(){document.querySelectorAll('.over').forEach(x=>x.classList.remove('over'))}
function onDragOver(e){if(!DRAG)return;const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();if(!z.classList.contains('over')){clearOver();z.classList.add('over')}}
function onDrop(e){if(!DRAG)return;const z=e.target.closest('[data-drop]');if(!z)return;e.preventDefault();const ids=DRAG;DRAG=null;clearOver();
  const[k,wid,before]=z.dataset.drop.split(':');
  if(k==='un')return moveJobs(ids,null);
  if(k==='row')return moveJobs(ids,wid,'best');
  if(k==='end')return moveJobs(ids,wid,null);
  if(k==='before'){if(ids.includes(before))return;return moveJobs(ids,wid,before)}
}
function onDragEnd(){DRAG=null;clearOver();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))}
function init(){
  load();
  try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('sample').then(s=>{SAMPLE=s||null}).catch(()=>{})}catch(e){}
  document.addEventListener('click',onClick);
  if(SERVER)setInterval(()=>{if(!document.hidden&&(S.tab==='planning'||S.tab==='opdrachten'))fetchStatus(S.date,true)},60000);if(SERVER)setInterval(()=>{if(!document.hidden&&(MV||(S.tab==='planning'&&Date.now()-MSG.at>30000)))fetchMsgs(true)},15000);document.addEventListener('change',onChange);
  document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.combo){const k=e.target.dataset.combo;$('#f_'+k).value='';comboShow(k,e.target.value);return}if(e.target.id==='jobQ'){S.jobQ=e.target.value;$('#jobsTbl').innerHTML=jobsTable()}if(e.target.id==='logQ'){LOGF.q=e.target.value;logRefresh()}});
  document.addEventListener('dragstart',onDragStart);document.addEventListener('dragover',onDragOver);document.addEventListener('drop',onDrop);document.addEventListener('dragend',onDragEnd);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.navg.open')){const b=document.querySelector('.navg.open > .tab');closeMenus();if(b)b.focus();return}if(!$('#modal').hidden)closeForm()}});
  $('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
  render();
}
if(typeof document!=='undefined'&&document.getElementById('view'))init();
</script>
